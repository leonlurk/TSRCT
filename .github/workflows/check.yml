name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the release gate first: nothing private may reach a public commit
      - run: node scripts/check-public.js
      - run: npm run check
